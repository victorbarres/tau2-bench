[project]
name = "nomos"
version = "0.1.0"
description = "Nomos — runnable benchmark and authoring environment for logic-first agent tasks. Includes the methodology, worked examples (retail returns, airline retrofit, library tutorial), verifiers, and a local web UI."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Victor Barres", email = "victor.barres@gmail.com" }]
requires-python = ">=3.10"
dependencies = [
    "clingo>=5.6",
    "markdown>=3.10.2",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
]

[project.optional-dependencies]
# Solo-mode LLM driver. Only needed when running tools/library_solo.py
# with --model <name>. The default --oracle mode has no LLM dependency.
solo = ["litellm>=1.50"]

[tool.uv]
# Nomos is a collection of scripts, data, and a small web app, not an
# installable Python package. We use uv for dependency management only.
package = false
