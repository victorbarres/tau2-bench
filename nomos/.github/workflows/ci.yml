name: CI

# Runs the verifier suite on every push and PR. All checks here are
# offline (no LLM calls, no upstream-tau-bench data) — they exercise
# the methodology's Verify, Solve, and Generate operations plus the
# solo-mode oracle.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Sync dependencies
        run: uv sync --extra solo

      - name: Pure-Python verifier (retail_returns, 6/6)
        run: uv run python tools/verify_retail_returns.py

      - name: Clingo verifier (retail_returns, 6/6)
        run: uv run python tools/clingo_verify.py

      - name: Clingo verifier (airline synthetic, 2/2)
        run: uv run python tools/clingo_verify_airline.py

      - name: Scenario generator (6/6 templates)
        run: uv run python tools/generate.py

      - name: Solo-mode oracle (library, 3/3)
        run: uv run python tools/library_solo.py --oracle

      - name: Backend imports
        run: uv run python -c "from bench.server.app import app; print(app.title, app.version)"
        env:
          PYTHONPATH: src

  web-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        working-directory: web
        run: npm install

      - name: Build the React app
        working-directory: web
        run: npm run build
